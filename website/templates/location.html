            <div id="container">
                <h2>Maps</h2>

                <div id="map"></div>

                <!-- prettier-ignore --> <!-- googles new modular loader -->
                <script>(g => { var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary", q = "__ib__", m = document, b = window; b = b[c] || (b[c] = {}); var d = b.maps || (b.maps = {}), r = new Set, e = new URLSearchParams, u = () => h || (h = new Promise(async (f, n) => { await (a = m.createElement("script")); e.set("libraries", [...r] + ""); for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]); e.set("callback", c + ".maps." + q); a.src = `https://maps.${c}apis.com/maps/api/js?` + e; d[q] = f; a.onerror = () => h = n(Error(p + " could not load.")); a.nonce = m.querySelector("script[nonce]")?.nonce || ""; m.head.append(a) })); d[l] ? console.warn(p + " only loads once. Ignoring:", g) : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)) })
                        ({ key: "", v: "weekly" });</script>
            </div>

            <div id="Address">
                <h2>Street Address</h2>
                <h3 id="addy">--</h3>
            </div>

        </div>
    </div>
</body>

<script>
    //Updates the map using the gps sensor
    let map;
    let marker;
    let currentLat = 53.277556;
    let currentLng = 9.009750;

    async function initMap() { //Loads the libraries
        const { Map } = await google.maps.importLibrary("maps");
        const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

        map = new Map(document.getElementById("map"), { //Creates the map 
            center: { lat: currentLat, lng: currentLng },
            zoom: 15,
            mapId: "9040f5107606389e1876cc8e",
        });

        marker = new AdvancedMarkerElement({
            position: { lat: currentLat, lng: currentLng },
            map: map,
            title: "Current location",
        });
    }

    initMap();

    //Updates marker position & mqtt stuff
    const socket = io();
    socket.on("mqtt_message", (message) => {
        const value = message.payload;
        const topic = message.topic;

        if (topic === "sensor/latitude") {
            const lat = parseFloat(value);
            if (!isNaN(lat)) {
                currentLat = lat;
                updateMap();
            }
        }

        else if (topic === "sensor/longitude") {
            const lng = parseFloat(value);
            if (!isNaN(lng)) {
                currentLng = lng;
                updateMap();
            }
        }

        else if (topic === "gps/address") {
            document.getElementById("addy").textContent = value;
        }
    });

    function updateMap() {
        if (!marker || !map) return;

        marker.position = { lat: currentLat, lng: currentLng };
        map.setCenter({ lat: currentLat, lng: currentLng });
    }
</script>

</html>
