<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSIA</title>
    <link rel="stylesheet" href="/static/css/style6.css?v=2">
</head>

<body>
    <div id="wrapper">
        <div id="Background">

            <div id="Menu">

                <div id="logo">
                    <img src="https://www.nicepng.com/png/full/89-891434_white-car-icon-png-car-icon-green-png.png">
                    <p>SSIA</p>
                </div>

                 <div class="scroll">
                    <div class="item">
                        <a href="/" target="_self">
                            Home
                        </a>
                    </div>

                    <div class="item">
                        <a href="/vehicle" target="_self">
                            Vehicle
                        </a>

                    </div>

                    <div class="item">
                        <a href="/location" target="_self">
                            Location
                        </a>
                    </div>

                    <div class="item">
                        <a href="/health" target="_self">
                            Health
                        </a>
                    </div>

                    <div class="item">
                        <a href="/graphs" target="_self">
                            Graphs
                        </a>
                    </div>

                    <div class="item">
                        <a href="/accounts" target="_self">
                            Accounts
                        </a>
                    </div>

                    <div class="item">
                        <a href="/demo" target="_self">
                            Demo
                        </a>
                    </div>

                    
                </div>
            </div>

            <div class="container">
                <h1>Account Manager</h1>

                <div id="message" class="message"></div>

                <div class="container-grid">

                    <div class="card">
                        <h2>Create New Account</h2>

                        <label for="full_name">Full Name</label>
                        <input type="text" id="full_name" placeholder="Enter full name">

                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter email">

                        <button class="action-btn" onclick="createAccount()">Create Account</button>
                    </div>

                    <div class="card">
                        <h2>Register New Card</h2>

                        <label for="card_user_id">User ID</label>
                        <input type="number" id="card_user_id" placeholder="Enter user ID">

                        <label for="card_label">Card Label</label>
                        <input type="text" id="card_label" placeholder="Main Card / Spare Card">

                        <button class="action-btn" onclick="startCardRegistration()">Register Card</button>
                    </div>

                    <div class="card">
                        <h2>Delete Account</h2>

                        <label for="delete_user_id">User ID</label>
                        <input type="number" id="delete_user_id" placeholder="Enter user ID">

                        <button class="action-btn danger-btn" onclick="deleteAccount()">Delete Account</button>
                    </div>
                </div>
            </div>
            <section class="container users-panel">
                <div class="users-header">
                    <div>
                        <h1>Registered Users</h1>
                        <p>View all current users and their card details.</p>
                    </div>
                    <button class="action-btn small-btn" onclick="loadUsers()">Refresh</button>
                </div>

                <div id="users_list" class="users-grid"></div>
            </section>
        </div>

    </div>
    <script src="{{ url_for('static', filename='js/accounts.js') }}"></script>
</body>

</html>
