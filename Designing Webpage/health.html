</head>

<body>
    <div id="wrapper">
        <div id="Background">

            <div id="Menu">

                <div id="logo">
                    <img src="https://www.nicepng.com/png/full/89-891434_white-car-icon-png-car-icon-green-png.png">
                    <p>SSIA</p>
                </div>

                <div class="item">
                    <a href="vehicle.html" target="_self">
                        Vehicle
                    </a>

                </div>

                <div class="item">
                    <a href="location.html" target="_self">
                        Location
                    </a>
                </div>

                <div class="item">
                    <a href="health.html" target="_self">
                        Health
                    </a>
                </div>

                <div class="item">

                        Graphs
                    </a>

                <div class="item">
                    <a href="main.html" target="_self">
                        Home
                    </a>

                <div class="nav-right"></div>
            </div>

            <div id="container">
                <div class="object object-1">

                </div>
                <div class="object object-2">

                </div>
                <div class="object object-3">

                </div>
            </div>

            <div class="container">
                <h2>Environment</h2>

                <div class="container-grid">
                    <div class="container-tile temp">
                        <span class="icon">🌡</span>
                        <h3>23<span>°C</span></h3>
                        <p>Temperature</p>
                    </div>

                    <div class="container-tile humidity">
                        <span class="icon">💧</span>
                        <h3>64<span>%</span></h3>
                        <p>Humidity</p>
                    </div>

                    <div class="container-tile distance">
                        <span class="icon">📏</span>
                        <h3>25<span>cm</span></h3>
                        <p>Distance</p>
                    </div>
                </div>
            </div>

            <div class="Camera">
                <img id="camera" src="%IP%" alt="Camera feed">
            </div>

        </div>
